<!DOCTYPE html>
<html lang="en">

<head>
    <title>JRPG Gang</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=0.5, user-scalable=0" />
    <link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
    <style>
        .loader-container {
            display: inline-block;
            position: fixed;
            width: 128px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .loader-animation {
            width: 128px;
            aspect-ratio: 9;
            background: radial-gradient(circle closest-side, #919191 90%, #0000) 0/calc(100%/9) 100% no-repeat;
            animation: l2 1.5s steps(9) infinite;
        }

        @keyframes l2 {
            to {
                background-position: 110%
            }
        }
    </style>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</head>

<body oncontextmenu="return false;">
    <div class="loader-container">
        <img src="../assets/icons/dungeon-01.png" />
        <div id="loader" class="loader-animation"></div>
    </div>
    <div id="main_scene_container" class="main-scene-container"></div>
</body>

</html>
