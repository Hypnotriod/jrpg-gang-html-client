<div class="game-wrapper">
    <div class="row" style="min-height: 150px;">
        <div id="flow_controls_container" class="col s4 center-align">
            <div class="row">
                <div class="col" style="margin-top: 0;">
                    <button id="button_abandon" class="btn-small red">Abandon</button>
                    <button id="button_leave" class="btn-small green darken-1">I'm Done</button>
                </div>
                <div class="row">
                    <button id="button_wait" class="btn-small green darken-1 col s2"
                        style="margin-right: 10px;">Wait</button>
                    <button id="button_next_phase" class="btn-small blue">Ready</button>
                    <button id="button_next_battle" class="btn-small darken-4 yellow">Next</button>
                    <button id="button_skip" class="btn-small purple">End Turn</button>
                </div>
            </div>
            <div class="left-align" style="padding: 0; margin-top: -32px; height: 12px; white-space: nowrap;">
                <span id="label_users_in_game" class="white-text left">Users</span>
            </div><br>
            <div class="col s8" style="padding: 0;">
                <div class="left-align" style="padding: 0;  height: 12px;">
                    <span id="label_dungeon_name" class="white-text purple darken-2">Dungeon</span>
                </div><br>
                <div class="left-align" style="padding: 0; height: 12px;">
                    <span class="white-text grey darken-2" style="height: 100px;">Party Loot:
                        <img src="./assets/icons/coin.png" style="vertical-align: middle; padding-bottom: 4px;" /><span
                            id="label_loot_coins">100</span>
                        <img src="./assets/icons/ruby.png" style="vertical-align: middle; padding-bottom: 4px;" /><span
                            id="label_loot_rubies">100</span>
                    </span>
                </div><br>
                <div class="left-align" style="padding: 0; height: 12px;">
                    <span id="label_dungeon_state" class="white-text grey darken-2">Dungeon Level: 7</span><br>
                </div><br>
                <div class="left-align" style="padding: 0; height: 12px; width: 200%;">
                    <span id="label_game_status" class="white-text green darken-2"></span>
                </div>
            </div>
            <div class="col s4 left-align" style="padding: 0;">
                <span id="label_health" class="white-text" style="font-size: 11px; width: 100px;">
                </span>
                <div id="health_bar" class="red darken-3" style="width: 0px; height: 13px; margin-top: -15px;"></div>

                <span id="label_stamina" class="white-text" style="font-size: 11px; width: 100px;">
                </span>
                <div id="stamina_bar" class="green darken-3" style="width: 0px; height: 13px; margin-top: -15px; ">
                </div>

                <span id="label_mana" class="white-text" style="font-size: 11px; width: 100px;">
                </span>
                <div id="mana_bar" class="purple darken-3" style="width: 0px; height: 13px; margin-top: -15px; "></div>

                <div id="effect_icons">
                    <img id="icon_bleeding" height="12px" src="./assets/icons/blood-drop.png">
                    <img id="icon_poison" height="12px" src="./assets/icons/poison-drop.png">
                    <img id="icon_cold" height="12px" src="./assets/icons/cold.png">
                    <img id="icon_lighting" height="12px" src="./assets/icons/lighting.png">
                    <img id="icon_fire" height="12px" src="./assets/icons/fire.png">
                    <img id="icon_health" height="12px" src="./assets/icons/health.png">
                    <img id="icon_stamina" height="12px" src="./assets/icons/stamina.png">
                    <img id="icon_mana" height="12px" src="./assets/icons/mana.png">
                    <img id="icon_drain" height="12px" src="./assets/icons/drain.png">
                    <img id="icon_stressed_sm" height="12px" src="./assets/icons/stressed.png">
                </div>
            </div>
        </div>
        <div class="col s8" style="height: 72px; padding: 0;">
            <b><span id="label_game_phase_info" class="grey-text" style="font-size: 13px;"></span></b>
        </div>
        <div class="col s8">
            <span class="orange-text"><b>TURN ORDER</b></span><br>
            <div id="units_queue_container" class="items-container-y"></div>
        </div>
    </div>
    <div class="row" style="margin-top: 16px;">
        <div class="col">
            <div id="battlefield_container" class="items-container-y left"></div>
        </div>
        <div class="col center-align" style="margin-top: -40px;">
            <span class="orange-text"><b>BATTLE LOG</b></span>
            <div id="game_log" class="game-log white-text scrollbar-y left-align"></div>
        </div>
        <div class="col center-align" style="margin-top: -40px;">
            <span class="orange-text"><b>CHAT</b></span>
            <div id="game_chat" class="game-chat white-text scrollbar-y left-align"></div>
            <div class="input-field game-chat-input left-align">
                <input id="input_game_chat_message" type="text">
            </div>
        </div>
    </div>
    <div id="unit_items_container" class="items-container-x scrollbar-x" style="margin: -3px; margin-top: -18px;">
    </div>
</div>
<div id="item_description_popup" class="item-description-popup white-text"></div>
<div id="dungeon_loot_popup" class="dungeon-loot-popup darken-4 hidden">
    <div class="row">
        <div class="col s4" style="padding-top: 6px;">
            <img src="./assets/icons/treasure.png" />
        </div>
        <div class="col s8">
            <b><span id="label_description" class="orange-text">Dungeon Loot</span></b><br>
            <div id="label_booty" class="white-text" style="padding-top: 6px;"> 100</div>
        </div>
    </div>
</div>
<div id="popup_shadow" class="popup-shadow hidden"></div>
<div id="leave_dungeon_popup" class="leave-dungeon-popup darken-4 hidden">
    <div class="row">
        <div class="col s4" style="padding-top: 6px;">
            <img src="./assets/icons/dungeon-01.png" />
        </div>
        <div class="col s8" style="padding: 0;">
            <b><span id="label_description" class="orange-text" style="padding-left: 0;">Abandon the
                    Dungeon?</span></b><br>
            <div id="label_booty" class="white-text" style="padding-top: 6px;">No loot for you!</div>
        </div>
        <div class="col s12 center" style="padding-top: 10px;">
            <button id="button_yes" class="btn-small green" style="margin-right: 2px;">Yes</button>
            <button id="button_no" class="btn-small red" style="margin-left: 2px;">No</button><br>
        </div>
    </div>
</div>
