<div class="lobby-wrapper">
    <div class="row grey-text">
        <button id="button_configurator" class="btn s12 purple right">⇐ Back</button>
        <b><img src="./assets/icons/info.png" style="vertical-align: middle; padding-bottom: 4px;" />
            Gather your party or<span class="blue-text lighten-2">JOIN</span>in and start the adventure. As a party
            leader, you can<span class="purple-text lighten-2">HIRE</span>a mercenary to aid you on your journey.
        </b><br>
        <div style="padding-top: 6px;">
            <span id="label_user_number" class="white-text" style="padding: 0;">Users Number: 0</span>
        </div>
    </div>
    <div class="row">
        <div class="col s9">
            <div class="row">
                <div class="col s2 center" style="padding: 0;">
                    <span id="unit_info" class="light-green lighten-1"></span><br>
                    <div id="unit_icon" class="selection-icon"></div><br>
                    <span id="unit_booty" class="white-text" style="padding: 0;"></span>
                </div>
                <div>
                    <div style="margin-bottom: 8px;" class="center-align">
                        <button id="button_dungeons" class="btn-small orange darken-2"
                            style="margin-right: 4px; padding: 12px; line-height: 0; max-height: 20px;">Dungeons</button>
                        <button id="button_parties" class="btn-small blue"
                            style="margin-left: 4px; padding: 12px; line-height: 0; max-height: 20px;">Parties
                            (0)</button>
                    </div>
                    <div id="rooms_container" class="rooms-container col s10"></div>
                    <div id="dungeons_container" class="dungeons-container col s10"></div>
                </div>
            </div>
        </div>
        <div class="col s3 center-align" style="margin-top: -14px;">
            <b><span class="orange-text">CHAT</span></b>
            <div id="lobby_chat" class="lobby-chat white-text scrollbar-y left-align"></div>
            <div class="input-field lobby-chat-input left-align">
                <input id="input_lobby_chat_message" type="text">
            </div>
        </div>
    </div>
</div>
<div id="popup_shadow" class="popup-shadow hidden"></div>
<div id="mercenaries_popup" class="mercenaries-popup white-text hidden">
    <div class="row grey-text">
        <button id="button_close" class="btn purple right">⇐ Back</button>
        <b><img src="./assets/icons/info.png" style="vertical-align: middle; padding-bottom: 4px;" />
            Hire a mercenary. No refunds.
        </b>
    </div>
    <div id="mercenaries_container" class="mercenaries-container scrollbar-y"></div>
</div>
<div id="item_description_popup" class="item-description-popup white-text"></div>
