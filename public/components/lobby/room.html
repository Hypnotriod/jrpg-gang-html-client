<div class="row card-panel-transparent" style="padding: 12px; padding-bottom: 0px;">
    <div class="col s3 center-align">
        <b>
            <span id="dungeon_label" class="grey-text lighten-5" style="padding-left: 14px;">Dungeon</span>
        </b>
        <img id="icon_room" style="width: 128px; border-radius: 5px; padding-left: 14px;" />
        <div class="row" style="margin-top: 4px;">
            <div class="col s6">
                <button id="button_join_room" class="btn-small blue darken-2"
                    style="padding: 15px; line-height: 0; max-height: 12px; width: 70px;">Join</button>
                <button id="button_leave_room" class="btn-small red darken-2"
                    style="padding: 15px; line-height: 0; max-height: 12px; width: 70px;">Leave</button>
            </div>
            <div class="col s6">
                <button id="button_start_game" class="btn-small blue darken-2"
                    style="padding: 15px; line-height: 0; max-height: 12px; width: 70px;">Start</button>
            </div>
        </div>
    </div>
    <div style="padding-top: 14px;">
        <div id="user_placeholder_1" class="col center s3">
            <span id="user_name_1" class="light-green lighten-1 single-line">User1</span><br>
            <span id="user_level_1" class="white-text single-line">Level 1</span><br>
            <div id="user_icon_1" class="selection-icon">
                <span id="connection_status_1" class="right" style="margin-right: -4px;"></span>
            </div><br>
            <label class="grey-text text-lighten-2">Party leader</label>
        </div>
        <div id="user_placeholder_2" class="col center s2">
            <span id="user_name_2" class="light-blue lighten-1 single-line">User2</span><br>
            <span id="user_level_2" class="white-text single-line">Level 1</span><br>
            <div id="user_icon_2" class="selection-icon">
                <span id="connection_status_2" class="right" style="margin-right: -4px;"></span>
            </div>
            <button id="button_kick_player_2" class="btn-small grey darken-3"
                style="padding: 4px; margin: 0; line-height: 0; max-height: 16px; display: inline;">Kick out</button>
        </div>
        <div id="user_placeholder_3" class="col center s2">
            <span id="user_name_3" class="light-blue lighten-1 single-line">User3</span><br>
            <span id="user_level_3" class="white-text single-line">Level 1</span><br>
            <div id="user_icon_3" class="selection-icon">
                <span id="connection_status_3" class="right" style="margin-right: -4px;"></span>
            </div>
            <button id="button_kick_player_3" class="btn-small grey darken-3"
                style="padding: 4px; margin: 0; line-height: 0; max-height: 16px; display: inline;">Kick out</button>
        </div>
        <div id="user_placeholder_4" class="col center s2">
            <span id="user_name_4" class="light-blue lighten-1 single-line">User4</span><br>
            <span id="user_level_4" class="white-text single-line">Level 1</span><br>
            <div id="user_icon_4" class="selection-icon">
                <span id="connection_status_4" class="right" style="margin-right: -4px;"></span>
            </div>
            <button id="button_kick_player_4" class="btn-small grey darken-3"
                style="padding: 4px; margin: 0; line-height: 0; max-height: 16px; display: inline;">Kick out</button>
        </div>
        <div id="hire_mercenary_placeholder" class="col center s2">
            <button id="button_hire_mercenary" class="btn-small purple darken-1"
                style="padding: 15px; line-height: 0; max-height: 12px;">Hire</button>
            <div id="mercenary_icon" class="selection-icon" style="margin-top: 14px;"> </div>
        </div>
    </div>
</div>
